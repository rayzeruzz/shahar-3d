<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shahar 3D · Mahalla</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #top{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
  .chip{background:rgba(9,17,28,.72);color:#e8f1fb;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.25;backdrop-filter:blur(6px);
    max-width:min(340px,72vw)}
  .chip b{color:#fff;font-weight:600}
  .chip span{opacity:.72}
  #bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;
    align-items:flex-end;justify-content:space-between}
  #modes{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  .btn{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(9,17,28,.78);
    color:#dce9f6;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;
    backdrop-filter:blur(6px);cursor:pointer;transition:background .15s,color .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn.on{background:#2f7cf6;border-color:#5c9dff;color:#fff;box-shadow:0 4px 18px rgba(47,124,246,.45)}
  #hint{pointer-events:none;font-size:11.5px;color:rgba(255,255,255,.82);
    background:rgba(9,17,28,.6);border-radius:10px;padding:7px 10px;max-width:min(430px,60vw);line-height:1.35}
  #load{position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:50;transition:opacity .5s;color:#cfe0f0;font-size:14px}
  #load.hide{opacity:0;pointer-events:none}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.16);border-top-color:#4f9dff;
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #panel{position:absolute;left:12px;right:12px;bottom:66px;max-width:340px;
    background:rgba(9,17,28,.93);border:1px solid rgba(255,255,255,.16);border-radius:14px;
    padding:12px 13px;pointer-events:auto;display:none;flex-direction:column;gap:10px;
    backdrop-filter:blur(8px);box-shadow:0 12px 34px rgba(0,0,0,.45)}
  #panel.open{display:flex}
  #panel h3{margin:0;font-size:12.5px;color:#cfe0f0;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .qrow{display:flex;gap:8px}
  .qbtn{flex:1;padding:9px 5px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);color:#dce9f6;font-size:12.5px;font-weight:600;cursor:pointer}
  .qbtn.on{background:#2f7cf6;border-color:#5c9dff;color:#fff}
  #qinfo{font-size:11.5px;color:rgba(255,255,255,.62);line-height:1.35}
  @media (max-width:640px){
    .btn{padding:9px 11px;font-size:12px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="load"><div class="spinner"></div><div>Shahar yuklanmoqda…</div></div>
<div id="hud">
  <div id="top">
    <div class="chip"><b>Mahalla 3D</b> <span>· 75 uy · maktab, kasalxona, bog', masjid, bozor</span></div>
    <div class="chip" id="stats"><span>FPS —</span> · <span id="qtag">Medium</span></div>
  </div>
  <div id="panel">
    <h3>Grafika sozlamalari</h3>
    <div class="qrow">
      <button class="qbtn" data-q="low">Low</button>
      <button class="qbtn" data-q="medium">Medium</button>
      <button class="qbtn" data-q="high">High</button>
    </div>
    <div id="qinfo">Qurilma aniqlanmoqda…</div>
    <h3>Vaqt</h3>
    <div class="qrow">
      <button class="qbtn" data-t="day">Kun</button>
      <button class="qbtn" data-t="night">Tun</button>
      <button class="qbtn" data-t="auto">Avto</button>
    </div>
    <div id="tinfo">Hozir: kun · 10:30</div>
  </div>
  <div id="bottom">
    <div id="modes">
      <button class="btn" data-mode="walk">Yurish</button>
      <button class="btn" data-mode="low">Past burchak</button>
      <button class="btn" data-mode="top">Tepa</button>
      <button class="btn" id="setBtn">Sozlamalar</button>
    </div>
    <div id="hint">Sichqoncha — aylantirish · g'ildirak — zoom · WASD — yurish · 1 / 2 / 3 — ko'rinish</div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------- core --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7e8);
scene.fog = new THREE.Fog(0xa8cbe6, 480, 1250);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.4, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xd7ecff, 0x4e5f3c, 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2da, 1.75);
sun.position.set(260, 380, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0007;
const sc = sun.shadow.camera;
sc.left = -330; sc.right = 330; sc.top = 330; sc.bottom = -330; sc.near = 1; sc.far = 1500;
scene.add(sun);
scene.add(sun.target);

/* ------------------------------------------------------------- quality --- */
const QSET = {
  low:    { pr: 1,   shadow: false, map: 512,  fogFar: 820,  far: 1600, peds: 70 },
  medium: { pr: 1.5, shadow: true,  map: 1024, fogFar: 1050, far: 2200, peds: 120 },
  high:   { pr: 2,   shadow: true,  map: 2048, fogFar: 1250, far: 3000, peds: 170 }
};
const QNAME = { low: 'Low', medium: 'Medium', high: 'High' };

function detectQuality() {
  const ua = navigator.userAgent || '';
  const mobile = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua);
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory || 4;
  const small = Math.min(screen.width || 1920, screen.height || 1080) < 820;
  if (mobile || small) return (cores >= 8 && mem >= 6) ? 'medium' : 'low';
  if (cores >= 8 && mem >= 8) return 'high';
  return 'medium';
}

let quality = 'medium';
try { quality = localStorage.getItem('shahar_q') || detectQuality(); } catch (e) { quality = detectQuality(); }

function applyQuality(q, save) {
  if (!QSET[q]) q = 'medium';
  quality = q;
  if (save) { try { localStorage.setItem('shahar_q', q); } catch (e) {} }
  const s = QSET[q];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, s.pr));
  renderer.setSize(innerWidth, innerHeight);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(s.map, s.map);
  sun.castShadow = s.shadow;
  renderer.shadowMap.enabled = s.shadow;
  scene.fog.far = s.fogFar;
  camera.far = s.far;
  camera.updateProjectionMatrix();
  scene.traverse(o => { if (o.isMesh) o.castShadow = !!s.shadow && o.userData.wantShadow === true; });
  setPedCount(s.peds);
  const info = document.getElementById('qinfo');
  if (info) info.textContent =
    'Qurilma: ' + (navigator.hardwareConcurrency || '?') + ' yadro' +
    (navigator.deviceMemory ? ' · ' + navigator.deviceMemory + ' GB RAM' : '') +
    ' · hozir: ' + QNAME[q] + (s.shadow ? '' : ' · soyalar o‘chirilgan');
  document.querySelectorAll('.qbtn').forEach(b => b.classList.toggle('on', b.dataset.q === q));
  const tag = document.getElementById('qtag');
  if (tag) tag.textContent = QNAME[q];
}

/* ------------------------------------------------------------- batches --- */
const matSolid = new THREE.MeshLambertMaterial({ color: 0xffffff });
const matGlass = new THREE.MeshLambertMaterial({ color: 0x2b3f52, emissive: 0xffcf8a, emissiveIntensity: 0.03 });
const matGlassLit = new THREE.MeshLambertMaterial({ color: 0x2b3f52, emissive: 0xffc879, emissiveIntensity: 0.03 });
const matWater = new THREE.MeshLambertMaterial({ color: 0x3f7fbd, transparent: true, opacity: 0.85 });
const LAMP_HEADS = [];

class Batch {
  constructor(geo, mat, baseRot) {
    this.geo = geo; this.mat = mat;
    this.baseRot = baseRot || [0, 0, 0];
    this.mats = []; this.cols = [];
    this.dummy = new THREE.Object3D();
  }
  add(x, y, z, sx, sy, sz, color, ry = 0, rx = 0, rz = 0) {
    const d = this.dummy;
    d.position.set(x, y, z);
    d.rotation.set(rx + this.baseRot[0], ry + this.baseRot[1], rz + this.baseRot[2]);
    d.scale.set(sx, sy, sz);
    d.updateMatrix();
    this.mats.push(d.matrix.clone());
    this.cols.push(color === undefined ? 0xffffff : color);
  }
  build(castShadow = true) {
    if (!this.mats.length) return null;
    const mesh = new THREE.InstancedMesh(this.geo, this.mat, this.mats.length);
    const c = new THREE.Color();
    for (let i = 0; i < this.mats.length; i++) {
      mesh.setMatrixAt(i, this.mats[i]);
      c.setHex(this.cols[i]);
      mesh.setColorAt(i, c);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = castShadow;
    mesh.userData.wantShadow = castShadow;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return mesh;
  }
}

const B = {
  box:   new Batch(new THREE.BoxGeometry(1, 1, 1), matSolid),
  cyl:   new Batch(new THREE.CylinderGeometry(0.5, 0.5, 1, 12), matSolid),
  cylX:  new Batch(new THREE.CylinderGeometry(0.5, 0.5, 1, 10), matSolid, [0, 0, Math.PI / 2]),
  cone:  new Batch(new THREE.ConeGeometry(0.5, 1, 7), matSolid),
  roof:  new Batch(new THREE.ConeGeometry(0.7071, 1, 4), matSolid, [0, Math.PI / 4, 0]),
  dome:  new Batch(new THREE.SphereGeometry(0.5, 14, 9, 0, Math.PI * 2, 0, Math.PI / 2), matSolid),
  sph:   new Batch(new THREE.SphereGeometry(0.5, 10, 8), matSolid),
  win:   new Batch(new THREE.PlaneGeometry(1, 1), matGlass)
};

const box  = (x, y, z, sx, sy, sz, color, ry = 0) => B.box.add(x, y, z, sx, sy, sz, color, ry);
const boxB = (x, z, sx, sz, h, color, ry = 0) => B.box.add(x, h / 2, z, sx, h, sz, color, ry);

/* --------------------------------------------------------------- palette -- */
const ASPHALT = 0x3c4046, SIDEWALK = 0xa9a79c, LINE = 0xf3f1e6;
const WALL = [0xd9c8a4, 0xcdb795, 0xe4dac6, 0xbfcbae, 0xd8b795, 0xc8c2b6, 0xe8e2d4];
const ROOF = [0x8d4b33, 0x7a3a28, 0x9b5c3d, 0x4a6b88, 0x6d5140];
const TREE = [0x3f6f36, 0x4c7d3e, 0x35602f, 0x578a44];
const PINE = [0x2c5734, 0x33643a, 0x264a2d];
const CAR   = [0xf2f2f2, 0x1e2a38, 0x9aa3ad, 0x2d5f9e, 0x8f1f24, 0x2f6b4f, 0xd9c14a, 0x5b3c78];
const FENCE = [0xb7ae9e, 0xc3b9a6, 0xa89f90];

/* ------------------------------------------------------------ utilities -- */
let seed = 20261110;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
const rand = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length) % arr.length];

function local(cx, cz, ry, dx, dz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  return [cx + dx * c - dz * s, cz + dx * s + dz * c];
}

/* ------------------------------------------------------------- signage --- */
function label(text, x, y, z, ry, w, h, bg, fg) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = bg || '#12457a'; g.fillRect(0, 0, 512, 128);
  g.fillStyle = fg || '#ffffff';
  g.font = 'bold 58px system-ui, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 68, 480);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
  m.position.set(x, y, z);
  m.rotation.y = ry;
  scene.add(m);
  return m;
}

/* --------------------------------------------------------------- roads --- */
function buildRoads() {
  // outer ring around the mahalla
  box(0, 0.03, -120, 420, 0.06, 9, ASPHALT);
  box(0, 0.03,  120, 420, 0.06, 9, ASPHALT);
  box(-201, 0.03, 0, 9, 0.06, 231, ASPHALT);
  box( 201, 0.03, 0, 9, 0.06, 231, ASPHALT);

  // inner mahalla streets
  for (const x of [-120, -40, 40, 120]) box(x, 0.03, 0, 14, 0.06, 236, ASPHALT);
  for (const z of [-40, 40]) box(0, 0.03, z, 400, 0.06, 8, ASPHALT);

  // approaches to the city districts
  box(0, 0.03, 175, 14, 0.06, 120, ASPHALT);
  box(-201, 0.03, 205, 9, 0.06, 180, ASPHALT);
  box(201, 0.03, 205, 9, 0.06, 180, ASPHALT);
  box(0, 0.03, -215, 14, 0.06, 200, ASPHALT);
  box(-120, 0.03, -170, 9, 0.06, 100, ASPHALT);
  box(120, 0.03, -170, 9, 0.06, 100, ASPHALT);
  box(-300, 0.03, 0, 200, 0.06, 9, ASPHALT);
  box(300, 0.03, 0, 200, 0.06, 9, ASPHALT);

  // sidewalks along the ring
  box(0, 0.06, -114.5, 420, 0.12, 2.2, SIDEWALK);
  box(0, 0.06,  114.5, 420, 0.12, 2.2, SIDEWALK);
  box(-195.5, 0.06, 0, 2.2, 0.12, 231, SIDEWALK);
  box( 195.5, 0.06, 0, 2.2, 0.12, 231, SIDEWALK);

  // centre dashes
  for (let x = -200; x <= 200; x += 12) {
    if (Math.abs(x) < 8) continue;
    box(x, 0.075, -120, 5, 0.02, 0.22, LINE);
    box(x, 0.075, 120, 5, 0.02, 0.22, LINE);
  }
  for (let z = -110; z <= 110; z += 12) {
    box(-201, 0.075, z, 0.22, 0.02, 5, LINE);
    box(201, 0.075, z, 0.22, 0.02, 5, LINE);
  }
  for (const x of [-120, -40, 40, 120]) {
    for (let z = -112; z <= 112; z += 12) box(x, 0.075, z, 0.22, 0.02, 5, LINE);
  }
  for (const z of [-40, 40]) {
    for (let x = -192; x <= 192; x += 12) box(x, 0.075, z, 5, 0.02, 0.2, LINE);
  }

  // zebra crossings near schools / hospital / kindergarten
  const zebra = (x, z, along) => {
    for (let i = -3; i <= 3; i++) {
      if (along === 'x') box(x + i * 1.1, 0.078, z, 0.55, 0.02, 7.2, LINE);
      else box(x, 0.078, z + i * 1.1, 7.2, 0.02, 0.55, LINE);
    }
  };
  zebra(-160, -120, 'x'); zebra(160, -120, 'x');
  zebra(-160, 120, 'x'); zebra(0, 120, 'x');
  zebra(-201, -40, 'z'); zebra(201, 40, 'z');
}

/* --------------------------------------------------------------- house --- */
function house(hx, hz, dir) {
  const w = rand(8.4, 10.2), d = 7, two = rnd() < 0.26;
  const h = two ? 6.4 : 3.6;
  const wallC = pick(WALL), roofC = pick(ROOF);
  const frontZ = hz + dir * (d / 2);

  boxB(hx, hz, w, d, h, wallC);
  B.roof.add(hx, h + 0.1, hz, w * 1.14, two ? 1.75 : 1.5, d * 1.16, roofC, 0);

  // plinth
  boxB(hx, hz, w + 0.25, d + 0.25, 0.35, 0x9d978c);

  // windows: front + both sides
  const faceZ = frontZ + dir * 0.04;
  const ryF = dir > 0 ? 0 : Math.PI;
  const wy = two ? [1.75, 4.55] : [1.8];
  for (const y of wy) {
    B.win.add(hx - w * 0.24, y, faceZ, 1.35, 1.5, 1, 0xffffff, ryF);
    B.win.add(hx + w * 0.24, y, faceZ, 1.35, 1.5, 1, 0xffffff, ryF);
  }
  B.win.add(hx - w / 2 - 0.04, 1.9, hz, 1.25, 1.4, 1, 0xffffff, -Math.PI / 2);
  B.win.add(hx + w / 2 + 0.04, 1.9, hz, 1.25, 1.4, 1, 0xffffff, Math.PI / 2);
  if (two) {
    B.win.add(hx - w / 2 - 0.04, 4.7, hz, 1.25, 1.4, 1, 0xffffff, -Math.PI / 2);
    B.win.add(hx + w / 2 + 0.04, 4.7, hz, 1.25, 1.4, 1, 0xffffff, Math.PI / 2);
  }

  // door
  box(hx, 1.15, frontZ + dir * 0.09, 1.25, 2.3, 0.16, 0x6b4a32, ryF);

  // ayvon (porch): roof slab on two posts
  if (!two) {
    const pz = frontZ + dir * 1.9;
    box(hx, 2.85, pz, 6.4, 0.22, 3.4, 0xd8d2c4);
    const [p1x, p1z] = local(hx, pz, 0, -2.85, dir * 1.5);
    const [p2x, p2z] = local(hx, pz, 0, 2.85, dir * 1.5);
    B.cyl.add(p1x, 1.42, p1z, 0.28, 2.84, 0.28, 0xe6e0d2);
    B.cyl.add(p2x, 1.42, p2z, 0.28, 2.84, 0.28, 0xe6e0d2);
    box(hx, 0.16, pz + dir * 1.5, 6.2, 0.3, 2.8, 0xa8a296);
  }

  // yard fence with a gate
  const fenceC = pick(FENCE);
  const yFront = frontZ + dir * 9, sideX = w / 2 + 2.4;
  const seg = sideX - 1.25;
  box(hx - sideX, 0.8, hz + dir * 5.2, 0.22, 1.6, 9.2, fenceC);
  box(hx + sideX, 0.8, hz + dir * 5.2, 0.22, 1.6, 9.2, fenceC);
  box(hx - (1.25 + seg / 2), 0.8, yFront, seg, 1.6, 0.22, fenceC);
  box(hx + (1.25 + seg / 2), 0.8, yFront, seg, 1.6, 0.22, fenceC);
  // gate posts + panels
  box(hx - 1.3, 1.05, yFront, 0.3, 2.1, 0.32, 0x8a8074);
  box(hx + 1.3, 1.05, yFront, 0.3, 2.1, 0.32, 0x8a8074);
  box(hx, 2.15, yFront, 2.9, 0.18, 0.34, 0x8a8074);
  box(hx, 0.85, yFront, 1.05, 1.5, 0.12, 0x7d5b3d);
  box(hx + 1.06, 0.85, yFront, 1.05, 1.5, 0.12, 0x7d5b3d);

  // yard tree
  if (rnd() < 0.75) {
    const [tx, tz] = local(hx, yFront, 0, rand(-sideX + 1, sideX - 1), rand(-6.5, -2.2));
    tree(tx, tz, rand(0.85, 1.25));
  }

  // parked car in the yard
  if (rnd() < 0.62) {
    const [cx, cz] = local(hx, yFront, 0, rand(-2.6, 2.6), rand(-4.4, -2.6));
    car(cx, cz, dir > 0 ? 0 : Math.PI, pick(CAR), rnd() < 0.3);
  }

  // courtyard greenery inside the block
  if (rnd() < 0.35) {
    const [gx, gz] = local(hx, hz, 0, rand(-9, 9), rand(-9, -5) * dir);
    tree(gx, gz, rand(0.9, 1.35));
  }
}

/* ---------------------------------------------------------------- trees -- */
function tree(x, z, s) {
  const c = pick(TREE);
  B.cyl.add(x, 1.4 * s, z, 0.5 * s, 2.8 * s, 0.5 * s, 0x6b4a33);
  B.sph.add(x, 3.5 * s, z, 3.4 * s, 2.9 * s, 3.4 * s, c);
  B.sph.add(x + 0.9 * s, 4.3 * s, z - 0.4 * s, 2.2 * s, 2.0 * s, 2.2 * s, c);
}
function pine(x, z, s) {
  const c = pick(PINE);
  B.cyl.add(x, 1.1 * s, z, 0.34 * s, 2.2 * s, 0.34 * s, 0x5d4130);
  B.cone.add(x, 3.4 * s, z, 3.3 * s, 4.4 * s, 3.3 * s, c);
  B.cone.add(x, 5.4 * s, z, 2.4 * s, 3.4 * s, 2.4 * s, c);
  B.cone.add(x, 7.1 * s, z, 1.5 * s, 2.6 * s, 1.5 * s, c);
}

/* ----------------------------------------------------------------- cars -- */
function car(cx, cz, ry, color, van) {
  const L = van ? 4.2 : 3.9, W = van ? 1.78 : 1.72;
  const bodyH = van ? 1.35 : 0.78;
  const bodyY = van ? 1.0 : 0.72;

  B.box.add(cx, bodyY, cz, W, bodyH, L, color, ry);
  if (van) {
    B.box.add(cx, 1.72, cz, W * 0.96, 0.55, L * 0.86, color, ry);
    B.win.add(...carWin(cx, cz, ry, 0, 1.72, L * 0.86 / 2 + 0.02, W * 0.8, 0.5), 0xffffff, ry);
    B.win.add(...carWin(cx, cz, ry, 0, 1.72, -L * 0.86 / 2 - 0.02, W * 0.8, 0.5), 0xffffff, ry + Math.PI);
  } else {
    const cabL = L * 0.5;
    B.box.add(cx, 1.32, cz, W * 0.94, 0.62, cabL, color, ry);
    B.box.add(cx, 1.36, cz, W * 0.9, 0.5, cabL * 0.92, 0x2b3a49, ry);
    B.box.add(cx, 0.55, cz, W * 1.02, 0.22, L * 0.9, 0x1b222b, ry);
  }
  const wx = W * 0.46, wz = L * 0.31;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const [x, z] = local(cx, cz, ry, sx * wx, sz * wz);
    B.cylX.add(x, 0.34, z, 0.68, 0.24, 0.68, 0x14161a, ry);
  }
}
function carWin(cx, cz, ry, dx, y, dz, w, h) {
  const [x, z] = local(cx, cz, ry, dx, dz);
  return [x, y, z, w, h, 1];
}

/* -------------------------------------------------------------- mahalla -- */
function buildMahalla() {
  const cols = [-160, -80, 0, 80, 160];
  const rows = [-80, 0, 80];
  for (const cx of cols) {
    for (const cz of rows) {
      for (let i = 0; i < 3; i++) house(cx + (i - 1) * 20.5, cz - 26, -1);
      for (let i = 0; i < 2; i++) house(cx + (i === 0 ? -11 : 11), cz + 26, 1);
      // courtyard trees
      for (let i = 0; i < 2; i++) tree(cx + rand(-22, 22), cz + rand(-9, 9), rand(0.8, 1.2));
    }
  }
  // street lamps inside the mahalla
  for (const x of [-120, -40, 40, 120]) {
    for (let z = -110; z <= 110; z += 28) {
      lamp(x + 8, z, -Math.PI / 2);
      lamp(x - 8, z + 14, Math.PI / 2);
    }
  }
  for (const z of [-40, 40]) {
    for (let x = -186; x <= 186; x += 30) lamp(x, z + 5.4, 0);
  }
}

/* ----------------------------------------------------------- day / night -- */
let dayT = 10.5, dayAuto = true, nightF = 0, lastMin = -1;
const DAY_SKY = new THREE.Color(0x9ec7e8), NIGHT_SKY = new THREE.Color(0x070d1c);
const DAY_FOG = new THREE.Color(0xa8cbe6), NIGHT_FOG = new THREE.Color(0x0b1426);
const DAY_HEMI = new THREE.Color(0xd7ecff), NIGHT_HEMI = new THREE.Color(0x22304a);
const DAY_GND = new THREE.Color(0x4e5f3c), NIGHT_GND = new THREE.Color(0x0c1420);
const SUN_HI = new THREE.Color(0xfff4e0), SUN_LO = new THREE.Color(0xff9550);
const MOON_COL = new THREE.Color(0x9fb6e8);
const _dn = new THREE.Color();
let bulbMesh = null, poolMesh = null, starPts = null, fcLightMesh = null;
let bulbMat = null, poolMat = null, starMat = null;

// windows are split in two batches: a share stays dark, the rest glow at night
function buildWindows() {
  const lit = [], dark = [];
  const mats = B.win.mats, cols = B.win.cols;
  for (let i = 0; i < mats.length; i++) (rnd() < 0.58 ? lit : dark).push(i);
  const mk = (idx, mat) => {
    if (!idx.length) return;
    const m = new THREE.InstancedMesh(B.win.geo, mat, idx.length);
    const c = new THREE.Color();
    for (let k = 0; k < idx.length; k++) {
      m.setMatrixAt(k, mats[idx[k]]);
      c.setHex(cols[idx[k]]);
      m.setColorAt(k, c);
    }
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
    m.castShadow = false; m.receiveShadow = true; m.frustumCulled = false;
    scene.add(m);
  };
  mk(lit, matGlassLit);
  mk(dark, matGlass);
}

function buildNightLights() {
  const n = LAMP_HEADS.length;
  const bulbGeo = new THREE.SphereGeometry(0.5, 6, 4);
  bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff2bf });
  bulbMesh = new THREE.InstancedMesh(bulbGeo, bulbMat, n);
  const poolGeo = new THREE.CircleGeometry(1, 16).rotateX(-Math.PI / 2);
  poolMat = new THREE.MeshBasicMaterial({ color: 0xffcf8c, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  poolMesh = new THREE.InstancedMesh(poolGeo, poolMat, n);
  const d = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const [x, z] = LAMP_HEADS[i];
    d.position.set(x, 5.25, z); d.rotation.set(0, 0, 0); d.scale.set(1.3, 1.05, 1.3);
    d.updateMatrix(); bulbMesh.setMatrixAt(i, d.matrix);
    const r = 6.2 + (i % 5) * 0.55;
    d.position.set(x, 0.1, z); d.scale.set(r, 1, r);
    d.updateMatrix(); poolMesh.setMatrixAt(i, d.matrix);
  }
  for (const m of [bulbMesh, poolMesh]) {
    m.instanceMatrix.needsUpdate = true; m.frustumCulled = false;
    m.castShadow = false; m.receiveShadow = false; m.visible = false;
    scene.add(m);
  }

  // star field
  const sp = new Float32Array(900 * 3);
  for (let i = 0; i < 900; i++) {
    const a = rnd() * Math.PI * 2, e = Math.acos(rnd() * 0.92), r = 1350;
    sp[i * 3] = Math.cos(a) * Math.sin(e) * r;
    sp[i * 3 + 1] = Math.cos(e) * r + 60;
    sp[i * 3 + 2] = Math.sin(a) * Math.sin(e) * r;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  starMat = new THREE.PointsMaterial({ color: 0xdde6ff, size: 2.1, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false, fog: false });
  starPts = new THREE.Points(sg, starMat);
  starPts.frustumCulled = false;
  scene.add(starPts);

  // headlights and taillights of the refueling cars
  fcLightMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }), FUEL_MAX * 4);
  const c = new THREE.Color();
  for (let i = 0; i < FUEL_MAX; i++) {
    for (let k = 0; k < 4; k++) {
      c.setHex(k < 2 ? 0xfff4cf : 0xff3322);
      fcLightMesh.setColorAt(i * 4 + k, c);
    }
  }
  if (fcLightMesh.instanceColor) fcLightMesh.instanceColor.needsUpdate = true;
  fcLightMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  fcLightMesh.frustumCulled = false;
  fcLightMesh.visible = false;
  fcLightMesh.count = 0;
  scene.add(fcLightMesh);
}

function syncTimeButtons() {
  const active = dayAuto ? 'auto' : (dayT < 6 || dayT >= 19 ? 'night' : 'day');
  document.querySelectorAll('.qbtn[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === active));
}

function updateDayNight(dt) {
  if (dayAuto) dayT = (dayT + dt * 0.006) % 24;
  const ang = ((dayT - 6) / 12) * Math.PI;
  const el = Math.sin(ang);
  const up = Math.max(0, el);
  nightF = 1 - THREE.MathUtils.smoothstep(el, -0.14, 0.26);
  const R = 560;
  if (el >= 0) sun.position.set(Math.cos(ang) * R, Math.max(el * R, 30), 140 + Math.cos(ang) * 70);
  else sun.position.set(-Math.cos(ang) * R, Math.max(-el * R, 70), 140 - Math.cos(ang) * 70);
  sun.intensity = 0.26 + 1.55 * up;
  sun.color.copy(el < 0 ? MOON_COL : _dn.copy(SUN_LO).lerp(SUN_HI, THREE.MathUtils.smoothstep(el, 0.02, 0.42)));
  hemi.intensity = 0.24 + 0.9 * up;
  hemi.color.copy(_dn.copy(NIGHT_HEMI).lerp(DAY_HEMI, 1 - nightF));
  hemi.groundColor.copy(_dn.copy(NIGHT_GND).lerp(DAY_GND, 1 - nightF));
  scene.background.copy(_dn.copy(NIGHT_SKY).lerp(DAY_SKY, 1 - nightF));
  scene.fog.color.copy(_dn.copy(NIGHT_FOG).lerp(DAY_FOG, 1 - nightF));
  scene.fog.far = QSET[quality].fogFar * (1 - 0.28 * nightF);
  matGlassLit.emissiveIntensity = 0.03 + nightF * 1.25;
  if (bulbMesh) {
    const on = nightF > 0.02;
    bulbMesh.visible = poolMesh.visible = on;
    poolMat.opacity = nightF * 0.34;
  }
  if (starPts) { starPts.visible = nightF > 0.02; starMat.opacity = nightF * 0.9; }
  if (fcLightMesh) fcLightMesh.visible = nightF > 0.18;
  const mins = Math.floor(dayT * 60);
  if (mins !== lastMin) {
    lastMin = mins;
    const el2 = document.getElementById('tinfo');
    if (el2) {
      const hh = String(Math.floor(mins / 60)).padStart(2, '0');
      const mm = String(mins % 60).padStart(2, '0');
      el2.textContent = 'Hozir: ' + (dayAuto ? 'avto' : (nightF > 0.5 ? 'tun' : 'kun')) + ' · ' + hh + ':' + mm;
    }
  }
}

function windowGrid(x, z, w, floors, ry, color) {
  const perFloor = Math.max(2, Math.floor(w / 4));
  for (let f = 0; f < floors; f++) {
    const y = 2.2 + f * 3.2;
    for (let i = 0; i < perFloor; i++) {
      const dx = (i - (perFloor - 1) / 2) * (w / perFloor);
      const [px, pz] = local(x, z, ry, dx, 0);
      B.win.add(px, y, pz, 1.5, 1.7, 1, 0xffffff, ry);
    }
  }
}

function buildRailway() {
  const R = 430;

    new THREE.MeshLambertMaterial({ color: 0x8b867c }));
  gravel.rotation.x = -Math.PI / 2;
  gravel.position.y = 0.02;
  gravel.receiveShadow = true;
  scene.add(gravel);

  for (const off of [-0.85, 0.85]) {
    const rail = new THREE.Mesh(new THREE.TorusGeometry(R + off, 0.16, 5, 240),
      new THREE.MeshLambertMaterial({ color: 0x9aa0a6 }));
    rail.rotation.x = -Math.PI / 2;
    rail.position.y = 0.32;
    scene.add(rail);
  }
  // sleepers
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 90) {
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    box(x, 0.18, z, 1.1, 0.16, 3.0, 0x6b5b47, -a);
  }
  // stations
  const names = ['Shimoliy vokzal', 'Sharqiy vokzal', 'Janubiy vokzal', 'G\'arbiy vokzal'];
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    const x = Math.cos(a) * (R - 12), z = Math.sin(a) * (R - 12);
    const ry = -a + Math.PI / 2;
    box(x, 0.28, z, 34, 0.5, 9, 0xd0c9b8, ry);
    boxB(x, z - 2.4, 26, 8, 4.6, 0xe8e0cd, ry);
    box(x, 5.0, z - 2.4, 28, 0.3, 10, 0x2f5f8a, ry);

  }
}

}

function buildPeds() {
  for (const L of PED_LANES) {
    for (let k = 0; k < 9; k++) {
      peds.push({
        ax: L.ax, c: L.c + (rnd() < 0.5 ? -0.8 : 0.8), y: L.y,
        a: L.a, b: L.b, s: rand(L.a, L.b), dir: rnd() < 0.5 ? 1 : -1,
        sp: rand(1.0, 1.85), scale: rand(0.92, 1.07), ph: rand(0, 6.28),
        cc: pick(PED_CLOTHES), sk: pick(PED_SKIN)
      });
    }
  }
  const stay = [
    [-201, -60], [201, 60], [-60, 120], [60, -120],
    [-264, -2], [-262, 8], [262, 180], [270, 176],
    [-40, 250], [-6, 152]
  ];
  for (const [x, z] of stay) {
    for (let k = 0; k < 3; k++) {
      peds.push({
        ax: 'stand', x: x + rand(-2.4, 2.4), z: z + rand(-2.4, 2.4), y: 0.08,
        ry0: rand(0, 6.28), sp: 0, scale: rand(0.9, 1.06), ph: rand(0, 6.28),
        cc: pick(PED_CLOTHES), sk: pick(PED_SKIN)
      });
    }
  }

      cb.setHex(peds[i].sk); pedHeadMesh.setColorAt(i, cb);
    } else {
      pedBodyMesh.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0));
      pedHeadMesh.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0));
    }
  }
  pedBodyMesh.instanceColor.needsUpdate = true;
  pedHeadMesh.instanceColor.needsUpdate = true;
  setPedCount(peds.length);
  updatePeds(0, 0);

function setPedCount(n) {
  pedActive = Math.min(MAXPED, Math.max(0, Math.min(n, peds.length)));
  pedBodyMesh.count = pedActive;
  pedHeadMesh.count = pedActive;
}

const _pd = new THREE.Object3D();
function updatePeds(dt, t) {
  for (let i = 0; i < pedActive; i++) {
    const p = peds[i];
    let x, z, ry;
    if (p.ax === 'stand') {
      x = p.x; z = p.z; ry = p.ry0 + Math.sin(t * 0.7 + p.ph) * 0.45;
    } else {
      if (p.sp > 0) {
        p.s += p.dir * p.sp * dt;
        if (p.s > p.b) { p.s = p.b; p.dir = -1; }
        if (p.s < p.a) { p.s = p.a; p.dir = 1; }
      }
      if (p.ax === 'x') { x = p.s; z = p.c; ry = p.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
      else { x = p.c; z = p.s; ry = p.dir > 0 ? 0 : Math.PI; }
    }
    const bob = p.sp > 0 ? Math.abs(Math.sin(t * 6 + p.ph)) * 0.05 : 0;
    _pd.rotation.set(0, ry, 0);
    _pd.position.set(x, p.y + 0.62 * p.scale + bob, z);
    _pd.scale.set(0.44 * p.scale, 1.05 * p.scale, 0.3 * p.scale);
    _pd.updateMatrix();
    pedBodyMesh.setMatrixAt(i, _pd.matrix);
    _pd.position.set(x, p.y + 1.36 * p.scale + bob, z);
    _pd.scale.set(0.23 * p.scale, 0.25 * p.scale, 0.23 * p.scale);
    _pd.updateMatrix();
    pedHeadMesh.setMatrixAt(i, _pd.matrix);
  }
  if (!dt) { pedBodyMesh.instanceMatrix.needsUpdate = true; pedHeadMesh.instanceMatrix.needsUpdate = true; return; }
  pedBodyMesh.instanceMatrix.needsUpdate = true;
  pedHeadMesh.instanceMatrix.needsUpdate = true;
}

const FUEL_MAX = 8;
const fcBodyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshLambertMaterial({ color: 0xffffff }), FUEL_MAX);
const fcCabMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),

const fcWheelMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 10),

for (const m of [fcBodyMesh, fcCabMesh, fcWheelMesh]) {

  m.receiveShadow = true; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(m);
}
const fuelCars = [];

function buildFuelCars() {
  const stations = [[-150, 250, -1], [240, 250, -1], [40, -250, -1]];
  const cb = new THREE.Color(), cc = new THREE.Color(0x2a3540);
  let n = 0;
  for (const [cx, cz, dw] of stations) {
    const rail = [
      { x: cx + dw * 120, z: cz - 6 }, { x: cx + dw * 42, z: cz - 6 },
      { x: cx + dw * 24, z: cz - 6 }, { x: cx - 5.5, z: cz - 6 },
      { x: cx - 5.5, z: cz - 2.4, w: 5 }, { x: cx - 5.5, z: cz + 5 },
      { x: cx + dw * 24, z: cz + 5 }, { x: cx + dw * 120, z: cz + 5 }
    ];
    for (let k = 0; k < 2; k++) {
      const path = rail.map(p => ({ ...p }));
      if (k === 1) { // second car uses the far pump
        path[3] = { x: cx + 5.5, z: cz - 6 };
        path[4] = { x: cx + 5.5, z: cz - 2.4, w: 4.5 };
        path[5] = { x: cx + 5.5, z: cz + 5 };
      }
      fuelCars.push({
        path, i: 1, x: path[0].x, z: path[0].z,
        ang: dw < 0 ? -Math.PI / 2 : Math.PI / 2, wait: rand(0, 9)
      });
      cb.setHex(pick(CAR));
      fcBodyMesh.setColorAt(n, cb);
      fcCabMesh.setColorAt(n, cc);
      n++;
    }
  }
  fcBodyMesh.instanceColor.needsUpdate = true;
  fcCabMesh.instanceColor.needsUpdate = true;
  fcBodyMesh.count = fcCabMesh.count = n;
  fcWheelMesh.count = n * 4;
  updateFuelCars(0);
}

const _fd = new THREE.Object3D();
function updateFuelCars(dt) {
  for (let i = 0; i < fuelCars.length; i++) {
    const c = fuelCars[i];
    if (c.wait > 0) { c.wait -= dt; }
    else {
      const t = c.path[c.i];
      const dx = t.x - c.x, dz = t.z - c.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.5) {
        c.x = t.x; c.z = t.z;
        c.wait = t.w || 0;
        c.i = (c.i + 1) % c.path.length;
      } else {
        const v = Math.min(11, d) * dt;
        c.x += dx / d * v; c.z += dz / d * v;
        c.ang = Math.atan2(dx, dz);
      }
    }
    _fd.rotation.set(0, c.ang, 0);
    _fd.position.set(c.x, 0.72, c.z);
    _fd.scale.set(1.72, 0.82, 3.9);
    _fd.updateMatrix();
    fcBodyMesh.setMatrixAt(i, _fd.matrix);
    _fd.position.set(c.x, 1.3, c.z);
    _fd.scale.set(1.6, 0.6, 1.95);
    _fd.updateMatrix();
    fcCabMesh.setMatrixAt(i, _fd.matrix);
    let w = i * 4;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const wx = c.x + (Math.cos(c.ang) * sx * 0.86 + Math.sin(c.ang) * sz * 1.25);
      const wz = c.z + (-Math.sin(c.ang) * sx * 0.86 + Math.cos(c.ang) * sz * 1.25);
      _fd.position.set(wx, 0.34, wz);
      _fd.rotation.set(0, c.ang, Math.PI / 2, 'YXZ');
      _fd.scale.set(0.68, 0.24, 0.68);
      _fd.updateMatrix();
      fcWheelMesh.setMatrixAt(w++, _fd.matrix);
    }
    if (fcLightMesh && fcLightMesh.count) {
      const ca = Math.cos(c.ang), sa = Math.sin(c.ang);
      let l = i * 4;
      for (const sz of [1.92, -1.92]) for (const sx of [-0.58, 0.58]) {
        _fd.position.set(c.x + ca * sx + sa * sz, 0.78, c.z - sa * sx + ca * sz);
        _fd.rotation.set(0, c.ang, 0);
        _fd.scale.set(0.34, 0.2, 0.12);
        _fd.updateMatrix();
        fcLightMesh.setMatrixAt(l++, _fd.matrix);
      }
    }
  }
  fcBodyMesh.instanceMatrix.needsUpdate = true;
  fcCabMesh.instanceMatrix.needsUpdate = true;
  fcWheelMesh.instanceMatrix.needsUpdate = true;
  if (fcLightMesh) {
    fcLightMesh.count = fuelCars.length * 4;
    fcLightMesh.instanceMatrix.needsUpdate = true;
  }
}

/* --------------------------------------------------------------- camera -- */
const cam = {
  mode: 'low',
  yaw: 0.95,
  pitch: 0.52,
  dist: 265,
  target: new THREE.Vector3(0, 0, 0),
  pos: new THREE.Vector3(0, 1.75, 60),
  lookYaw: Math.PI,
  lookPitch: -0.03
};
const keys = Object.create(null);
let dragging = false, lastX = 0, lastY = 0;
let touchDist = 0;

function applyCamera() {
  if (cam.mode === 'walk') {
    camera.position.copy(cam.pos);
    const dir = new THREE.Vector3(
      Math.sin(cam.lookYaw) * Math.cos(cam.lookPitch),
      Math.sin(cam.lookPitch),
      Math.cos(cam.lookYaw) * Math.cos(cam.lookPitch)
    );
    camera.lookAt(cam.pos.x + dir.x, cam.pos.y + dir.y, cam.pos.z + dir.z);
  } else {
    const p = Math.max(0.06, Math.min(1.5, cam.pitch));
    const r = cam.dist;
    camera.position.set(
      cam.target.x + r * Math.cos(p) * Math.sin(cam.yaw),
      cam.target.y + r * Math.sin(p),
      cam.target.z + r * Math.cos(p) * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.target.x, cam.target.y, cam.target.z);
  }
}

function setMode(mode) {
  cam.mode = mode;
  if (mode === 'low') { cam.pitch = 0.5; cam.dist = 265; cam.target.set(0, 0, 0); }
  if (mode === 'top') { cam.pitch = 1.42; cam.dist = 520; cam.target.set(0, 0, 0); }
  if (mode === 'walk') { cam.pos.set(0, 1.75, 112); cam.lookYaw = Math.PI; cam.lookPitch = -0.02; }
  document.querySelectorAll('.btn[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  applyCamera();
}

addEventListener('keydown', e => {

  if (e.code === 'Digit3') setMode('top');

});
addEventListener('keyup', e => { keys[e.code] = false; });

const el = renderer.domElement;
el.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (cam.mode === 'walk') {
    cam.lookYaw -= dx * 0.004;
    cam.lookPitch = Math.max(-1.2, Math.min(1.2, cam.lookPitch - dy * 0.003));
  } else {
    cam.yaw -= dx * 0.005;
    cam.pitch = Math.max(0.08, Math.min(1.5, cam.pitch - dy * 0.004));
  }
});
el.addEventListener('wheel', e => {
  e.preventDefault();
  if (cam.mode === 'walk') cam.pos.y = Math.max(1.2, Math.min(60, cam.pos.y + e.deltaY * 0.02));
  else cam.dist = Math.max(18, Math.min(900, cam.dist * (1 + e.deltaY * 0.0012)));
}, { passive: false });

el.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchDist = Math.hypot(dx, dy);
  }
}, { passive: true });

el.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    if (cam.mode === 'walk') {
      cam.lookYaw -= dx * 0.005;
      cam.lookPitch = Math.max(-1.2, Math.min(1.2, cam.lookPitch - dy * 0.004));
    } else {
      cam.yaw -= dx * 0.006;
      cam.pitch = Math.max(0.08, Math.min(1.5, cam.pitch - dy * 0.005));
    }
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (touchDist > 0 && cam.mode !== 'walk') cam.dist = Math.max(18, Math.min(900, cam.dist * (touchDist / d)));
    touchDist = d;
  }
  e.preventDefault();
}, { passive: false });

el.addEventListener('touchend', () => { touchDist = 0; }, { passive: true });

/* ----------------------------------------------------------------- loop -- */
const clock = new THREE.Clock();
let frames = 0, fpsTime = 0, fps = 0;
const statsEl = document.getElementById('stats');

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 46 : 14;

  if (cam.mode === 'walk') {
    const fx = Math.sin(cam.lookYaw), fz = Math.cos(cam.lookYaw);
    const rx = Math.cos(cam.lookYaw), rz = -Math.sin(cam.lookYaw);
    let mx = 0, mz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) { mx += fx; mz += fz; }
    if (keys['KeyS'] || keys['ArrowDown']) { mx -= fx; mz -= fz; }
    if (keys['KeyA'] || keys['ArrowLeft']) { mx -= rx; mz -= rz; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx += rx; mz += rz; }
    const len = Math.hypot(mx, mz);
    if (len > 0) {
      cam.pos.x += (mx / len) * speed * dt;
      cam.pos.z += (mz / len) * speed * dt;
      cam.pos.y = 1.75;
    }
    cam.pos.x = Math.max(-620, Math.min(620, cam.pos.x));
    cam.pos.z = Math.max(-620, Math.min(620, cam.pos.z));
  } else {
    const pan = 70 * dt;
    const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
    const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    if (keys['KeyW'] || keys['ArrowUp']) { cam.target.x -= fx * pan; cam.target.z -= fz * pan; }
    if (keys['KeyS'] || keys['ArrowDown']) { cam.target.x += fx * pan; cam.target.z += fz * pan; }
    if (keys['KeyA'] || keys['ArrowLeft']) { cam.target.x -= rx * pan; cam.target.z -= rz * pan; }
    if (keys['KeyD'] || keys['ArrowRight']) { cam.target.x += rx * pan; cam.target.z += rz * pan; }
  }

  applyCamera();
  updateDayNight(dt);
  updatePeds(dt, clock.elapsedTime);
  updateFuelCars(dt);
  renderer.render(scene, camera);

  frames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    fps = Math.round(frames / fpsTime);
    frames = 0; fpsTime = 0;
    statsEl.innerHTML = '<span>FPS ' + fps + ' · obyektlar ' + renderer.info.render.calls + ' ta chizma</span>';
  }
  requestAnimationFrame(tick);
}
